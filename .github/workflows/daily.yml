name: 每日军情简报

on:
  schedule:
    # 北京时间每天约 06:45 = UTC 22:45（前一天）。每天运行。
    # 用非整点(:45)并略提前，缓冲 GitHub Actions 定时常见的几分钟~几十分钟延迟，
    # 让实际推送尽量落在早上 7 点前后。
    - cron: "45 22 * * *"
  workflow_dispatch:

concurrency:
  group: daily-military-news
  cancel-in-progress: false

permissions:
  contents: write        # 提交生成的报告用于 GitHub Pages

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run daily brief
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          PAGES_BASE: https://longrain153.github.io/daily-military-news
        run: python main.py

      - name: Publish to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "brief: publish $(date -u +%Y-%m-%d)"
            git push
          fi
