name: 每日军情简报

on:
  schedule:
    # 北京时间每天 07:00 = UTC 23:00（前一天）。每天运行。
    - cron: "0 23 * * *"
  workflow_dispatch:

concurrency:
  group: daily-military-news
  cancel-in-progress: false

permissions:
  contents: write        # 提交生成的报告用于 GitHub Pages

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Install Chromium + xvfb for screenshots
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get install -y xvfb
      - name: Run daily brief
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          PAGES_BASE: https://longrain153.github.io/daily-military-news
        run: xvfb-run --auto-servernum python main.py

      - name: Publish to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "brief: publish $(date -u +%Y-%m-%d)"
            git push
          fi
