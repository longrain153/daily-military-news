name: 每日军情简报

on:
  schedule:
    # 北京约 06:45 / 07:15 / 07:45 三次冗余触发（UTC 22:45 / 23:15 / 23:45，前一天）。
    # GitHub 定时常丢任务，多触发几次提高命中率；配合 SKIP_IF_DONE 去重，当天只发一次。
    - cron: "45 22 * * *"
    - cron: "15 23 * * *"
    - cron: "45 23 * * *"
  workflow_dispatch:

concurrency:
  group: daily-military-news
  cancel-in-progress: false

permissions:
  contents: write        # 提交生成的报告用于 GitHub Pages

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Install Chromium for screenshots
        run: python -m playwright install --with-deps chromium
      - name: Run daily brief
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          PAGES_BASE: https://longrain153.github.io/daily-military-news
          SKIP_IF_DONE: ${{ github.event_name == 'schedule' && '1' || '' }}
        run: python main.py

      - name: Publish to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "brief: publish $(date -u +%Y-%m-%d)"
            git push
          fi
